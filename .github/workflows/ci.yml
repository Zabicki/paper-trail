name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # Both gates run before `build` so a type or logic failure surfaces without
      # paying for a full build first. `npm run typecheck` is `astro check`, which
      # needs the types `astro sync` generates above — hence the ordering.
      # Neither step needs a secret: SUPABASE_URL/KEY stay scoped to the build step.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Applies the MERGED migration set to an empty database and runs every pgTAP
  # assertion — the gap per-branch local runs structurally cannot close. Fully
  # local (`supabase start` provisions its own stack), so the job needs no
  # secrets and no `environment:`, and therefore no approval gate.
  db-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci FIRST, and `npx supabase` throughout. This job PROVISIONS a
      # database, which puts it on the local side of the grants divide: it must
      # resolve the lockfile's 2.98.2. Do NOT reuse the supabase/setup-cli@v1
      # 2.114.0 block from the deploy job below — that CLI stops granting
      # select/insert/update/delete to anon/authenticated on new public tables,
      # and every pgTAP file then fails "permission denied for table ..." before
      # a single assertion runs. See context/foundation/lessons.md.
      - run: npm ci
      # -x vector: [analytics] enabled = true (supabase/config.toml:371-372)
      # spawns a log-shipper whose failing health check aborts the whole start.
      # There is no vector block to disable; the CLI flag is the only lever.
      - run: npx supabase start -x vector
      # From-scratch apply of the MERGED migration set, plus seed.sql — which the
      # pgTAP suites hard-require for the two fixed users their rows FK to.
      - run: npx supabase db reset
      - run: npx supabase test db
      # A Postgres segfault (entries_summary_test.sql:225-249) drops every
      # connection, so later files fail with connection errors and the real cause
      # never reaches the pgTAP output.
      - if: failure()
        run: docker logs supabase_db_paper-trail --tail 200

  # Drives the real app in a browser: `astro dev` on workerd against a Supabase
  # stack this job provisions itself, with nothing mocked. Runs on pushes AND
  # pull requests — unlike db-test — because a regression that only shows up
  # across the auth -> routing -> API -> RLS seams should be caught in review,
  # not after merge.
  e2e:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci FIRST, and `npx supabase` throughout — the same grants divide
      # db-test sits on. This job PROVISIONS a database, so it must resolve the
      # lockfile's 2.98.2. Do NOT reuse the supabase/setup-cli@v1 2.114.0 block
      # from the deploy job below: that CLI stops granting
      # select/insert/update/delete to anon/authenticated on new public tables,
      # and every data route then fails in a way that reads exactly like a
      # broken migration. See context/foundation/lessons.md.
      - run: npm ci
      # -x vector, as in db-test: [analytics] enabled = true
      # (supabase/config.toml:371-372) spawns a log-shipper whose failing health
      # check aborts the whole start. There is no vector block to disable.
      - run: npx supabase start -x vector
      # Not redundant with `start`. `db reset` is what applies supabase/seed.sql,
      # and tests/e2e/auth.setup.ts signs in as rls-test-user-a@example.com,
      # which exists nowhere else.
      - run: npx supabase db reset
      # This job needs NO secrets and no `environment:`. `astro dev` on workerd
      # resolves .dev.vars, then .env, then the process environment; with
      # neither file in the checkout the third is enough, and the values below
      # are the LOCAL stack's — never the hosted project's.
      #
      # The quote strip is load-bearing: `supabase status -o env` emits
      # KEY="value" with the double quotes as literal characters, and
      # $GITHUB_ENV does not interpret them. A URL whose first character is `"`
      # still passes createClient()'s null-check in src/lib/supabase.ts, so the
      # break would surface much later as a fetch failure during sign-in. The
      # grep also keeps the service-role key and the JWT secret out of the app's
      # environment.
      - name: Export the local stack's URL and anon key
        run: |
          set -euo pipefail
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY \
            | grep -E '^SUPABASE_(URL|KEY)="' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"
      # Its own step, so `npm ci` stays byte-identical across all four jobs and
      # so the install's duration reads off the step timings on its own.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Same failure class as db-test's docker-logs dump: a red run is opaque
      # without it. playwright.config.ts already records a trace on first retry
      # and a screenshot on failure; this step is what makes them reachable from
      # a runner.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push'
    # db-test gates the one step that reaches production. Both jobs are
    # push-only, so pull requests skip both and this edge is never exercised there.
    needs: [ci, db-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Schema before code. `supabase/migrations/*.sql` only reach the hosted
      # database through this step — nothing else in the pipeline touches it, and
      # a Worker deployed against an un-migrated schema 500s on every data route
      # with "Could not find the table 'public.x' in the schema cache".
      # Runs after the build so a build failure can't leave production migrated
      # with no matching code deploy.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # No --include-seed: supabase/seed.sql inserts two fixed test users
      # straight into auth.users and must never run against production.
      - run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
